# Cloudflare-friendly origin config for eobom.ponslink.com
# - Port 80 proxies to the app (no HTTPS redirect) so Cloudflare Flexible/Full both work
# - X-Forwarded-Proto prefers CF / proxy headers so NextAuth secure cookies stay correct

map $http_cf_visitor $cf_visitor_scheme {
    default "";
    "~*\"scheme\"\s*:\s*\"https\"" "https";
    "~*\"scheme\"\s*:\s*\"http\""  "http";
}

map $http_x_forwarded_proto $proxy_xfp {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $cf_visitor_scheme $eobom_forwarded_proto {
    default $proxy_xfp;
    "https" "https";
    "http"  "http";
}

server {
    listen 80;
    listen [::]:80;
    server_name eobom.ponslink.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $eobom_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eobom.ponslink.com;

    ssl_certificate     /etc/letsencrypt/live/eobom.ponslink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eobom.ponslink.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $eobom_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
