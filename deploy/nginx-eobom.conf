# Cloudflare-friendly origin config for eobom.ponslink.com
# - Port 80 proxies to the app (no HTTPS redirect) so Cloudflare Flexible/Full both work
# - The $eobom_forwarded_proto / $cf_visitor_scheme / $proxy_xfp maps are defined once in
#   /etc/nginx/conf.d/eobom-maps.conf on the server (shared, do not redefine here).
# - Upstream keepalive: reuses connections to the app so every navigation does NOT pay a
#   fresh TCP/TLS handshake to the origin (this was the main source of 3s+ click latency).

# Conditional Connection header: "upgrade" only for real WebSocket upgrades,
# empty otherwise so nginx keeps the upstream connection alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Persistent connection pool to the app.
upstream eobom_app {
    server 127.0.0.1:3120;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name eobom.ponslink.com;

    client_max_body_size 10m;

    # Health: GET /api/health (and ?db=1) is served via the app proxy below.

    location / {
        proxy_pass http://eobom_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $eobom_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        # MiMo 120s + retry/fallback chain can exceed the old 120s ceiling.
        proxy_read_timeout 600s;
        proxy_buffering on;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eobom.ponslink.com;

    ssl_certificate     /etc/letsencrypt/live/eobom.ponslink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eobom.ponslink.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://eobom_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $eobom_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        # MiMo 120s + retry/fallback chain can exceed the old 120s ceiling.
        proxy_read_timeout 600s;
        proxy_buffering on;
    }
}
